<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spec-coder architecture</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #020617; color: #e2e8f0; font-family: Arial, sans-serif; }
    main { width: min(1320px, 100%); margin: 0 auto; padding: 28px 36px 36px; border: 1px solid #334155; border-radius: 16px; background: #0f172a; }
    svg { display: block; width: 100%; height: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>spec-coder: request to verified delivery</h1>
    <p>Three layers, three gates, one verified delivery path</p>
    <svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-label="Simplified spec-coder architecture">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/></marker>
        <marker id="darrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#fb7185"/></marker>
      </defs>
      <rect width="1320" height="760" fill="#0f172a"/>
      <g font-family="Arial, sans-serif" text-anchor="middle">
        <rect x="70" y="35" width="250" height="58" rx="9" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="195" y="61" fill="#e2e8f0" font-size="17" font-weight="700">User request</text><text x="195" y="80" fill="#94a3b8" font-size="12">intent + constraints</text>
        <rect x="390" y="35" width="250" height="58" rx="9" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="515" y="61" fill="#e2e8f0" font-size="17" font-weight="700">spec-coder router</text><text x="515" y="80" fill="#94a3b8" font-size="12">one task route</text>
        <rect x="710" y="35" width="330" height="58" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="875" y="61" fill="#e2e8f0" font-size="17" font-weight="700">Task + Stage Playbooks</text><text x="875" y="80" fill="#94a3b8" font-size="12">complete SOP composition</text>
        <path d="M320 64 H390 M640 64 H710" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="70" y="145" width="340" height="115" rx="12" fill="#111827" stroke="#64748b" stroke-width="2"/><text x="240" y="180" fill="#cbd5e1" font-size="19" font-weight="700">Principles</text><text x="240" y="210" fill="#e2e8f0" font-size="15">judgment rules</text><text x="240" y="234" fill="#94a3b8" font-size="12">constraints and limits</text>
        <rect x="490" y="145" width="340" height="115" rx="12" fill="#111827" stroke="#64748b" stroke-width="2"/><text x="660" y="180" fill="#cbd5e1" font-size="19" font-weight="700">Playbooks</text><text x="660" y="210" fill="#e2e8f0" font-size="15">task SOP + stage SOP</text><text x="660" y="234" fill="#94a3b8" font-size="12">workflow and proof obligations</text>
        <rect x="910" y="145" width="340" height="115" rx="12" fill="#111827" stroke="#64748b" stroke-width="2"/><text x="1080" y="180" fill="#cbd5e1" font-size="19" font-weight="700">Skills</text><text x="1080" y="210" fill="#e2e8f0" font-size="15">capabilities and tools</text><text x="1080" y="234" fill="#94a3b8" font-size="12">bounded execution surfaces</text>
        <path d="M875 93 V120 H240 V145 M875 120 H660 V145 M875 120 H1080 V145" fill="none" stroke="#64748b" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)"/>

        <text x="660" y="315" fill="#94a3b8" font-size="14">Fixed approval and delivery path</text>
        <rect x="60" y="345" width="180" height="64" rx="9" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="150" y="372" fill="#dbeafe" font-size="16" font-weight="700">Gate 1</text><text x="150" y="393" fill="#bfdbfe" font-size="12">design</text>
        <rect x="270" y="345" width="180" height="64" rx="9" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="360" y="372" fill="#dbeafe" font-size="16" font-weight="700">Gate 2</text><text x="360" y="393" fill="#bfdbfe" font-size="12">specification</text>
        <rect x="480" y="345" width="180" height="64" rx="9" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="570" y="372" fill="#dbeafe" font-size="16" font-weight="700">Gate 3</text><text x="570" y="393" fill="#bfdbfe" font-size="12">tickets + waves</text>
        <rect x="690" y="345" width="250" height="64" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="815" y="372" fill="#d1fae5" font-size="16" font-weight="700">Native executor</text><text x="815" y="393" fill="#a7f3d0" font-size="12">implement-spec runtime</text>
        <rect x="970" y="345" width="290" height="64" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="1115" y="372" fill="#d1fae5" font-size="16" font-weight="700">TDD + main review</text><text x="1115" y="393" fill="#a7f3d0" font-size="12">bounded work, then integration</text>
        <path d="M240 377 H270 M450 377 H480 M660 377 H690 M940 377 H970" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="285" y="505" width="750" height="78" rx="11" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="660" y="538" fill="#d1fae5" font-size="18" font-weight="700">Fresh verification → verified delivery</text><text x="660" y="562" fill="#a7f3d0" font-size="13">delivery-coder review, atomic commits, and completion evidence</text>
        <path d="M1115 409 V465 H660 V505" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="260" y="650" width="800" height="65" rx="11" fill="#3f1d2e" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 5"/><text x="660" y="678" fill="#ffe4e6" font-size="17" font-weight="700">Main-only authority</text><text x="660" y="699" fill="#fecdd3" font-size="12">gates · scope · integration · commits · completion</text>
        <path d="M150 409 C150 620 350 620 400 650 M570 409 C570 620 590 620 590 650 M815 409 C815 620 720 620 720 650 M660 583 V650" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/>
      </g>
    </svg>
  </main>
</body>
</html>
